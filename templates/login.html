<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body class="login-body">

    <div class="login-container">

        <h1>Login</h1>

        <p class="subtitle">
            Please login to continue
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <div class="demo-login">

            <p>
                Demo Login
            </p>

            <strong>
                admin@gmail.com
            </strong>

            <br>

            <strong>
                123456
            </strong>

        </div>

    </div>

</body>

</html>
